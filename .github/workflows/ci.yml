name: SafiMaintain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Python compile check
        run: python -m compileall -q backend
      - name: Runtime dependency vulnerability check
        run: |
          pip install pip-audit==2.10.1
          python -m pip_audit -r backend/requirements.txt
      - name: Backend tests
        run: python -m pytest -q backend/tests
      - name: JavaScript syntax check
        run: |
          for file in dist/assets/*.js dist/service-worker.js; do
            node --check "$file"
          done
      - name: All frontend regression tests
        run: node tests/run_regressions.js
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm run test:browser
