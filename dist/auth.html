<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SafiMaintain · Sign in</title><link rel="stylesheet" href="assets/accounts.css"><script src="assets/accounts-auth.js" defer></script></head>
<body><main class="auth-card"><div class="brand">SafiMaintain</div><p>Maintenance made clear.</p><h1 id="title">Sign in</h1><form id="account-form"><label id="email-label">Email<input id="email" type="email" autocomplete="username" required maxlength="254"></label><label id="password-label">Password<input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"></label><label id="mode-label">Workspace<select id="mode"><option value="web">Web workspace</option><option value="mobile">Mobile / field workspace</option></select></label><button id="submit">Sign in</button></form><p id="message" role="status" aria-live="polite"></p><button id="forgot" class="secondary" type="button">Forgot password?</button><a id="signin" href="/auth.html" hidden>Back to sign in</a></main></body></html>
