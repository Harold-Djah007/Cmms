<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17222d">
  <meta name="description" content="SafiMaintain CMMS — simple, connected maintenance, assets, stock and team workflows for Safisana operations.">
  <title>SafiMaintain CMMS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/safimaint-fiix-base.css">
  <link rel="stylesheet" href="assets/safimaint-fiix-components.css">
  <link rel="stylesheet" href="assets/safimaint-simple.css">
  <link rel="stylesheet" href="assets/safimaint-professional.css">
  <link rel="stylesheet" href="assets/safimaint-premium-v12.css">
  <link rel="stylesheet" href="assets/safimaint-live-motion-v13.css">
  <link rel="stylesheet" href="assets/safimaint-semantic-motion-v14.css">
  <link rel="stylesheet" href="assets/safimaint-semantic-motion-v15.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="assets/safimaint-logo.svg" alt="SafiMaintain">
        <div><strong>SafiMaintain</strong><span>MAINTENANCE OS</span></div>
      </div>

      <button class="site-card" id="siteButton" type="button">
        <span class="site-mark"></span>
        <span><strong>Your site</strong><small>Set up your workspace</small></span>
        <span class="chev">⌄</span>
      </button>

      <nav id="navigation"></nav>

      <div class="sidebar-foot">
        <span class="connection-dot" id="connectionDot"></span>
        <div><strong id="connectionText">Device data ready</strong><small id="connectionSub">Offline-capable prototype</small></div>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menuButton" type="button" aria-label="Open navigation">☰</button>
        <button class="search-box" id="globalSearchButton" type="button">
          <span>⌕</span><span>Search assets, work, parts…</span><kbd>Ctrl K</kbd>
        </button>
        <div class="top-actions">
          <button class="button ghost" id="scanButton" type="button">▦ Scan</button>
          <button class="icon-button notice-button" id="noticeButton" type="button" aria-label="Notifications">●<b id="topNoticeBadge"></b></button>
          <button class="button primary" id="newWorkButton" type="button">＋ New work</button>
          <div class="user-chip"><span>YU</span><div><strong>New user</strong><small>Set up account</small></div></div>
        </div>
      </header>

      <main id="appView" tabindex="-1"></main>
    </section>
  </div>

  <div class="scrim" id="scrim"></div>
  <dialog class="modal" id="modal"><form method="dialog" id="modalForm"></form></dialog>
  <dialog class="modal search-modal" id="searchModal"><form method="dialog" id="searchForm"></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/safimaint-00-config.js" defer></script>
  <script src="assets/safimaint-01-seed.js" defer></script>
  <script src="assets/safimaint-02-core.js" defer></script>
  <script src="assets/safimaint-03-operations.js" defer></script>
  <script src="assets/safimaint-04-assets.js" defer></script>
  <script src="assets/safimaint-05-inventory-a.js" defer></script>
  <script src="assets/safimaint-06-inventory-b.js" defer></script>
  <script src="assets/safimaint-07-admin.js" defer></script>
  <script src="assets/safimaint-08-dialogs-search.js" defer></script>
  <script src="assets/safimaint-09-events.js" defer></script>
  <script src="assets/safimaint-10-fiix-workflows.js" defer></script>
  <script src="assets/safimaint-11-simple-onboarding.js" defer></script>
  <script src="assets/safimaint-live-ui.js" defer></script>
  <script src="assets/safimaint-premium-v12.js" defer></script>
  <script src="assets/safimaint-live-motion-v13.js" defer></script>
  <script src="assets/safimaint-semantic-motion-v14.js" defer></script>
  <script src="assets/safimaint-semantic-motion-v15.js" defer></script>
</body>
</html>
