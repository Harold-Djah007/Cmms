<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17222d">
  <meta name="description" content="SafiMaintain CMMS — connected maintenance, assets, inventory, purchasing and administration for Safisana operations.">
  <title>SafiMaintain CMMS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/safimaint-fiix-base.css">
  <link rel="stylesheet" href="assets/safimaint-fiix-components.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="assets/safimaint-logo.svg" alt="SafiMaintain">
        <div><strong>SafiMaintain</strong><span>MAINTENANCE OS</span></div>
      </div>

      <button class="site-card" id="siteButton" type="button">
        <span class="site-mark"></span>
        <span><strong>Safisana Ghana</strong><small>Main operations site</small></span>
        <span class="chev">⌄</span>
      </button>

      <nav id="navigation">
        <section>
          <p>Command center</p>
          <button class="nav-item active" data-route="dashboard"><span class="nav-icon">⌂</span><span>Overview</span></button>
          <button class="nav-item" data-route="calendar"><span class="nav-icon">▦</span><span>Maintenance calendar</span></button>
        </section>
        <section>
          <p>Work management</p>
          <button class="nav-item" data-route="work-orders"><span class="nav-icon">⚒</span><span>Work orders</span><b id="workBadge"></b></button>
          <button class="nav-item" data-route="pm"><span class="nav-icon">↻</span><span>Scheduled maintenance</span></button>
          <button class="nav-item" data-route="requests"><span class="nav-icon">✉</span><span>Requests</span><b id="requestBadge"></b></button>
        </section>
        <section>
          <p>Asset management</p>
          <button class="nav-item" data-route="assets"><span class="nav-icon">▣</span><span>Assets</span><b id="offlineBadge"></b></button>
          <button class="nav-item" data-route="meters"><span class="nav-icon">◴</span><span>Meters</span></button>
          <button class="nav-item" data-route="downtime"><span class="nav-icon">◉</span><span>Downtime</span></button>
        </section>
        <section>
          <p>Parts & purchasing</p>
          <button class="nav-item" data-route="inventory"><span class="nav-icon">◇</span><span>Parts & supplies</span><b id="stockBadge"></b></button>
          <button class="nav-item" data-route="transactions"><span class="nav-icon">⇄</span><span>Stock transactions</span></button>
          <button class="nav-item" data-route="counts"><span class="nav-icon">✓</span><span>Cycle counts</span></button>
          <button class="nav-item" data-route="planning"><span class="nav-icon">☷</span><span>Purchase planning</span><b id="purchaseBadge"></b></button>
          <button class="nav-item" data-route="purchase-orders"><span class="nav-icon">▤</span><span>Purchase orders</span></button>
          <button class="nav-item" data-route="vendors"><span class="nav-icon">⌂</span><span>Vendors</span></button>
          <button class="nav-item" data-route="tool-crib"><span class="nav-icon">⚙</span><span>Tool crib</span></button>
        </section>
        <section>
          <p>Insights</p>
          <button class="nav-item" data-route="reliability"><span class="nav-icon">⌁</span><span>Reliability</span></button>
        </section>
        <section>
          <p>Administration</p>
          <button class="nav-item" data-route="people"><span class="nav-icon">♙</span><span>People & groups</span></button>
          <button class="nav-item" data-route="roles"><span class="nav-icon">◫</span><span>Roles & permissions</span></button>
          <button class="nav-item" data-route="sites"><span class="nav-icon">⌖</span><span>Sites & stores</span></button>
          <button class="nav-item" data-route="notifications"><span class="nav-icon">●</span><span>Mail & alerts</span><b id="alertBadge"></b></button>
          <button class="nav-item" data-route="audit"><span class="nav-icon">↺</span><span>Audit trail</span></button>
          <button class="nav-item" data-route="security"><span class="nav-icon">⬡</span><span>Security</span></button>
        </section>
      </nav>

      <div class="sidebar-foot">
        <span class="connection-dot" id="connectionDot"></span>
        <div><strong id="connectionText">Device data ready</strong><small id="connectionSub">Offline-capable prototype</small></div>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menuButton" type="button" aria-label="Open navigation">☰</button>
        <button class="search-box" id="globalSearchButton" type="button">
          <span>⌕</span><span>Search assets, work, parts…</span><kbd>Ctrl K</kbd>
        </button>
        <div class="top-actions">
          <button class="button ghost" id="scanButton" type="button">▦ Scan</button>
          <button class="icon-button notice-button" id="noticeButton" type="button" aria-label="Notifications">●<b id="topNoticeBadge"></b></button>
          <button class="button primary" id="newWorkButton" type="button">＋ New work order</button>
          <div class="user-chip"><span>AS</span><div><strong>Abena Sarpong</strong><small>Operations manager</small></div></div>
        </div>
      </header>

      <main id="appView" tabindex="-1"></main>
    </section>
  </div>

  <div class="scrim" id="scrim"></div>
  <dialog class="modal" id="modal"><form method="dialog" id="modalForm"></form></dialog>
  <dialog class="modal search-modal" id="searchModal"><form method="dialog" id="searchForm"></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/safimaint-00-config.js" defer></script>
  <script src="assets/safimaint-01-seed.js" defer></script>
  <script src="assets/safimaint-02-core.js" defer></script>
  <script src="assets/safimaint-03-operations.js" defer></script>
  <script src="assets/safimaint-04-assets.js" defer></script>
  <script src="assets/safimaint-05-inventory-a.js" defer></script>
  <script src="assets/safimaint-06-inventory-b.js" defer></script>
  <script src="assets/safimaint-07-admin.js" defer></script>
  <script src="assets/safimaint-08-dialogs-search.js" defer></script>
  <script src="assets/safimaint-09-events.js" defer></script>
  <script src="assets/safimaint-10-fiix-workflows.js" defer></script>
</body>
</html>
