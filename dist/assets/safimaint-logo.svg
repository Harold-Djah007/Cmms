<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">SafiMaintain</title>
  <desc id="desc">Four connected blue blocks representing assets, work, people and parts.</desc>
  <defs>
    <linearGradient id="blueA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2da8ff"/>
      <stop offset="1" stop-color="#1685e2"/>
    </linearGradient>
    <linearGradient id="blueB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1685e2"/>
      <stop offset="1" stop-color="#0966be"/>
    </linearGradient>
    <linearGradient id="blueC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd4ff"/>
      <stop offset="1" stop-color="#42afe9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#062f55" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="18" y="18" width="48" height="48" rx="13" fill="url(#blueA)"/>
    <rect x="76" y="18" width="34" height="34" rx="9" fill="url(#blueB)"/>
    <rect x="18" y="76" width="34" height="34" rx="9" fill="url(#blueB)"/>
    <rect x="62" y="62" width="48" height="48" rx="13" fill="url(#blueC)"/>
  </g>
</svg>
